specVersion: "4.0"
metadata:
  name: timesheet.app
type: application
framework:
  name: OpenUI5
  version: "1.120.48"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.layout
    - name: themelib_sap_horizon
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: timesheet
        relativePaths: true
        additionalFiles:
          - xs-app.json
